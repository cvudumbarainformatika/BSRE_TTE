services:
  # Database PostgreSQL 16 + pgvector Extension
  db:
    image: pgvector/pgvector:pg16
    container_name: simrs_tte_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-simrs_tte}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ClamAV Antivirus Daemon (Didukung di Mac via platform linux/amd64 emulasi)
  clamav:
    image: clamav/clamav:latest
    platform: linux/amd64
    container_name: simrs_tte_clamav
    restart: unless-stopped
    ports:
      - "3310:3310"

  # Backend FastAPI Microservice (Python 3.11 + TTE BSRE Engine)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simrs_tte_backend
    restart: unless-stopped
    ports:
      - "8005:8000"
    env_file:
      - .env
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy

  # Frontend Quasar Vite + Tailwind (Modular Widgets)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simrs_tte_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      - backend

  # Nginx Proxy Manager (Reverse Proxy, SSL Generator & Bridging Gateway untuk Domain .go.id)
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: simrs_tte_npm
    restart: unless-stopped
    ports:
      - "80:80"      # Public HTTP
      - "81:81"      # Web UI Admin Management Console
      - "443:443"    # Public HTTPS (SSL)
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend

  # Web File Manager (Visual Documents & Project File Explorer)
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: simrs_tte_filebrowser
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - .:/srv
      - filebrowser_data:/database

volumes:
  postgres_data:
  npm_data:
  npm_letsencrypt:
  filebrowser_data:
